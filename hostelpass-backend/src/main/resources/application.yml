spring:
  application:
    name: hostelpass-backend

  profiles:
    active: dev

  jpa:
    open-in-view: false
    hibernate:
      # validate, never update/create — Flyway migrations (db/migration/*) are the
      # single source of truth for schema, per the frozen SDD (Section 4 & 18).
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8081
  servlet:
    # Implements SDD Section 7's "Base path: /api/v1" for every endpoint.
    # Applied here globally rather than per-controller so no future controller
    # can forget the prefix. NOTE: this strips "/api/v1" from the path Spring
    # Security / CORS match against internally — see CorsConfig.java, which is
    # updated alongside this change for exactly that reason.
    context-path: /api/v1
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# Custom JWT properties, bound by security/jwt/JwtProperties.java in Phase 3.
# Values come from environment variables — never hardcoded, unlike the original
# prototype's plaintext admin passwords (see architecture review, Section 7).
app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_IN_ENV_NEVER_USE_DEFAULT_IN_PROD}
    access-token-expiry-ms: 900000       # 15 minutes, per SDD Section 11
    refresh-token-expiry-ms: 604800000   # 7 days, per SDD Section 11
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
